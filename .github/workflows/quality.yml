name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LSP_NATIVE_ML_TESTS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-linux.lock
      - name: Install Linux profile with hashes
        run: python -m pip install --require-hashes -r requirements-linux.lock
      - name: Unit and pipeline checks (synthetic fixtures)
        run: python -m unittest discover -s tests -v
      - name: Native runtime smoke
        run: python -m scripts.check_environment --output ci-environment.json
      - name: Design contrast
        run: python -m scripts.check_contrast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-evidence
          path: ci-environment.json
          if-no-files-found: ignore
